    <div class="profile-card">

      <img
        [src]="user?.profilePictureUrl || 'assets/images/default-avatar.png'"
        alt="photo"
        class="profile-image" />

      <p class="profile-name">
        {{ user?.lastName }} {{ user?.firstName }}
      </p>

      <p class="profile-email">
        {{ user?.email }}
      </p>

    </div>
