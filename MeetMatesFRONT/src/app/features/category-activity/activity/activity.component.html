<div class="activity-page">

  <app-state-handler 
    [loading]="loading"
    [error]="error">
  </app-state-handler>

  @if (!loading() && !error()) {

    <div class="activities-grid">

      @for (activity of activities(); track activity.id) {

        <app-icon-card
          [title]="activity.name"
          [iconPath]="'assets/images/icons/' + activity.imageUrl"
          (cardClick)="goToEvents(activity.id)">
        </app-icon-card>

      }

    </div>

  }

</div>
