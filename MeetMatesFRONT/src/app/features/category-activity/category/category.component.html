<div class="category-page">

  <app-state-handler 
    [loading]="loading"
    [error]="error">
  </app-state-handler>

  @if (!loading() && !error()) {

    <div class="categories-grid">

      @for (category of categories(); track category.id) {
      <app-icon-card
        [title]="category.name"
        [iconPath]="'assets/images/icons/' + category.imageUrl"
        (cardClick)="navigateTo(category.id)">
      </app-icon-card>
      }

    </div>

  }

</div>
