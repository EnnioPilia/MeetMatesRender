<form [formGroup]="form" (ngSubmit)="onSubmit()">

  <app-event-info
    [form]="form"
    [showStatus]="mode === 'edit'">
  </app-event-info>

  <app-event-activity
    [form]="form"
    [activities]="activities">
  </app-event-activity>

  <app-event-address
    [form]="form"
    [suggestions]="addressSuggestions"
    (inputChange)="onAddressInput($event)"
    (optionSelected)="onAddressSelect($event)">
  </app-event-address>

  <app-event-date-time
    [form]="form">
  </app-event-date-time>

  <app-event-details
    [form]="form">
  </app-event-details>

<app-button
  label="E N R E G I S T R E R"
  type="submit"
  [fullWidth]="true">
</app-button>

</form>
