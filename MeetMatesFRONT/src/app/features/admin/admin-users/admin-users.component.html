<div class="admin-page">

  <app-state-handler
    [loading]="loading"
    [error]="error">
  </app-state-handler>

  @if (users()) {

    <div class="admin-content">

      <h2 class="admin-title">
        Liste des utilisateurs
      </h2>

      <div class="users-list">

        @for (user of users(); track user.id) {

          <div class="user-card">

            <div class="user-infos">

              <span class="user-name">
                {{ user.firstName }} {{ user.lastName }}
              </span>

              <span class="user-email">
                {{ user.email }}
              </span>

              <span class="user-meta">
                Rôle : {{ user.role }}
              </span>

              <span class="user-meta">
                Statut : {{ user.status }}
              </span>

            </div>

            <div class="user-actions">

              @if (!user.deletedAt) {

                <app-button
                  label="SUPPRIMER"
                  class="secondary-button"
                  (clicked)="softDeleteUser(user.id)">
                </app-button>

              }

              @if (user.deletedAt) {

                <app-button
                  label="RESTAURER"
                  class="secondary-button"
                  (clicked)="restoreUser(user.id)">
                </app-button>

              }

              <app-button
                label="SUPPRIMER DÉFINITIVEMENT"
                class="secondary-button"
                (clicked)="hardDeleteUser(user.id)">
              </app-button>

            </div>

          </div>

        }

      </div>

    </div>

  } @else {

    <p class="empty-state">
      Aucun utilisateur trouvé.
    </p>

  }

</div>
