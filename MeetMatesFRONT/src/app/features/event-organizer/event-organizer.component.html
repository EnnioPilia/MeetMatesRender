<div class="organizer-page">

  <app-state-handler
    [loading]="loading"
    [error]="error">
  </app-state-handler>

  @if (event()) {

    <div class="organizer-content">

      <app-event-header
        class="organizer-header"
        [title]="event()!.title"
        [description]="event()!.description">
      </app-event-header>

      <mat-tab-group
        class="participants-tabs"
        mat-align-tabs="start"
        animationDuration="300ms">

        <mat-tab label="Acceptés">

          <app-event-tab-accepted
            [acceptedParticipants]="event()!.acceptedParticipants"
            [organizerName]="event()!.organizerName"
            (reject)="onReject($event)">
          </app-event-tab-accepted>

        </mat-tab>

        <mat-tab label="En attente">

          <app-event-tab-pending
            [pendingParticipants]="event()!.pendingParticipants"
            (accept)="onAccept($event)"
            (reject)="onReject($event)">
          </app-event-tab-pending>

        </mat-tab>

      </mat-tab-group>

      <app-event-info
        class="event-info-card"
        [event]="event()!"
        [showStatus]="true"
        [showOrganizer]="false">
      </app-event-info>

      <div class="organizer-actions">

        <app-button
          label="M O D I F I E R"
          class="primary-button"
          [routerLink]="['/edit-event', event()!.id]">
        </app-button>

        <app-button
          label="S U P P R I M E R"
          class="primary-button"
          (clicked)="deleteEvent()">
        </app-button>

      </div>

    </div>

  }

</div>
