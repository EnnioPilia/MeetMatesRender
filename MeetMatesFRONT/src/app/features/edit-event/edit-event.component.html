<div class="edit-event-page">

  <app-state-handler
    [loading]="loading"
    [error]="error">
  </app-state-handler>

  @if (formData()) {

    <app-event-form
      mode="edit"
      [initialData]="formData()!"
      [activities]="activities()"
      [addressSuggestions]="addressSuggestions()"
      (addressInput)="searchAddress($event)"
      (submitForm)="update($event)">
    </app-event-form>

  }

</div>
