<div class="event-info-card">

  @if (showActivity) {

    <p>
      <strong>Activité :</strong>
      {{ event.activityName }}
    </p>

  }

  @if (showStatus && hasStatus) {

    <p>
      <strong>Status de l'activité :</strong>

      <span [ngClass]="statusLabel | statusColor">
        {{ statusLabel }}
      </span>
    </p>

  }

  @if (showParticipationStatus) {

    <p>
      <strong>Votre participation :</strong>

      <span [ngClass]="participationLabel | statusColor">
        {{ participationLabel }}
      </span>
    </p>

  }

  @if (showAddress) {

    <p>
      <strong>Adresse :</strong>

      {{ event.addressLabel }}
    </p>

  }

</div>
