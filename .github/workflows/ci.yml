name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:

  backend:
    name: Backend Tests (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Run tests
        run: |
          cd MeetMatesBACK
          ./mvnw clean verify
        env:
          SPRING_PROFILES_ACTIVE: test

  frontend:
    name: Frontend Tests (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install & test
        run: |
          cd MeetMatesFRONT
          npm install
          npm run test -- --watch=false --browsers=ChromeHeadless